        // Helper: calculate distance (Haversine)
        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon / 2) * Math.sin(dLon / 2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            return R * c;
        }

        // Render rental list with distance & filtering
        function renderRentalList(location, rentals, filterType) {
            const container = document.getElementById('rentalListContainer');
            let filtered = filterType === 'all' ? rentals : rentals.filter(r => r.type === filterType);

            // Sort by distance
            filtered = filtered.map(r => ({
                ...r,
                distance: calculateDistance(location.lat, location.lng, r.lat, r.lng)
            })).sort((a, b) => a.distance - b.distance);

            document.getElementById('rentalCount').innerText = filtered.length;

            if (filtered.length === 0) {
                container.innerHTML = `<div class="no-results"><i class="fas fa-search"></i> No ${filterType !== 'all' ? filterType : ''} rentals found nearby.<br>Try changing filter or search another city.</div>`;
                return;
            }

            let html = '';
            filtered.forEach(rental => {
                const typeIcon = rental.type === 'car' ? 'fa-car' : (rental.type === 'bike' ? 'fa-motorcycle' : 'fa-scooter');
                const typeColor = rental.type === 'car' ? '#3b82f6' : (rental.type === 'bike' ? '#f59e0b' : '#10b981');
                html += `
                <div class="rental-card">
                    <div class="rental-name">
                        <i class="fas ${typeIcon}" style="color: ${typeColor};"></i>
                        ${rental.name}
                        <span class="rental-type" style="background: ${typeColor};">${rental.type.toUpperCase()}</span>
                    </div>
                    <div class="rental-details">
                        <span><i class="fas fa-map-pin"></i> ${rental.address}</span>
                        <span class="distance"><i class="fas fa-route"></i> ${rental.distance.toFixed(1)} km</span>
                        <span><i class="fas fa-star" style="color: #fbbf24;"></i> ${rental.rating}</span>
                    </div>
                    <div class="phone-number" onclick="copyPhone('${rental.phone.replace(/'/g, "\\'")}')">
                        <i class="fas fa-phone-alt"></i> ${rental.phone}
                        <i class="fas fa-copy" style="font-size: 0.7rem; opacity:0.7;"></i>
                    </div>
                </div>
            `;
            });
            container.innerHTML = html;
        }

            rentalMarkers.forEach(marker => map.removeLayer(marker));

            let filtered = filterType === 'all' ? rentals : rentals.filter(r => r.type === filterType);

            });

            // Update or create user marker
            if (userMarker) map.removeLayer(userMarker);
            const userIcon = L.divIcon({
                className: 'user-marker',
                html: '<div style="background-color:#3b82f6; width:16px; height:16px; border-radius:50%; border:3px solid white; box-shadow:0 0 0 3px rgba(59,130,246,0.5);"></div>',
                iconSize: [20, 20]
            });
            userMarker = L.marker([userLat, userLng], {
                icon: userIcon
            }).bindPopup('<b>📍 Your Location</b>').addTo(map);
            map.setView([userLat, userLng], 12);
        }

        // Main function: update everything based on user location and filters
        function updateAll(lat, lng, cityName = null) {
            currentUserLocation = {
                lat,
                lng
            };
            // Update location badge
            if (cityName) {
                document.getElementById('locationStatus').innerHTML = `${cityName} (${lat.toFixed(2)}, ${lng.toFixed(2)})`;
            } else {
                document.getElementById('locationStatus').innerHTML = `Lat: ${lat.toFixed(4)}, Lng: ${lng.toFixed(4)}`;
            }

            // Filter rentals by distance within ~100km radius for relevance (but show all, sorted by distance)
            const nearbyRentals = globalRentals.map(r => ({
                ...r,
                distance: calculateDistance(lat, lng, r.lat, r.lng)
            })).sort((a, b) => a.distance - b.distance);

            currentRentalsList = nearbyRentals;
            renderRentalList(currentUserLocation, globalRentals, activeFilter);
            updateMapMarkers(lat, lng, globalRentals, activeFilter);
        }

        // Geocode city name to coordinates (Nominatim)
        async function geocodeCity(cityName) {
            const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(cityName)}&limit=1`;
            try {
                const response = await fetch(url);
                const data = await response.json();
                if (data && data.length > 0) {
                    return {
                        lat: parseFloat(data[0].lat),
                        lng: parseFloat(data[0].lon),
                        display: data[0].display_name
                    };
                }
                return null;
            } catch (err) {
                console.error("Geocoding error", err);
                return null;
            }
        }

        // Get user's live location
        function getLiveLocation() {
            document.getElementById('locationStatus').innerHTML = '<i class="fas fa-spinner fa-pulse"></i> Getting GPS...';
            if (!navigator.geolocation) {
                alert("Geolocation not supported. Using default (London).");
                updateAll(51.5074, -0.1278, "London (Default)");
                return;
            }
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const {
                        latitude,
                        longitude
                    } = position.coords;
                    updateAll(latitude, longitude, "Your Live Location");
                    document.getElementById('citySearch').value = "";
                },
                (error) => {
                    console.warn(error);
                    let errMsg = "Location access denied. Using New York as default.";
                    alert("Please allow location permissions for best experience. Using default NYC.");
                    updateAll(40.7128, -74.0060, "New York (Default)");
                }, {
                    enableHighAccuracy: true,
                    timeout: 10000
                }
            );
        }

        // Search city worldwide
        async function searchCity() {
            const cityQuery = document.getElementById('citySearch').value.trim();
            if (!cityQuery) {
                alert("Please enter a city name (e.g., Tokyo, London, Mumbai)");
                return;
            }
            document.getElementById('locationStatus').innerHTML = '<i class="fas fa-spinner fa-pulse"></i> Searching city...';
            const coords = await geocodeCity(cityQuery);
            if (coords) {
                updateAll(coords.lat, coords.lng, cityQuery);
            } else {
                alert(`City "${cityQuery}" not found. Try another name.`);
                document.getElementById('locationStatus').innerHTML = 'Location not found';
            }
        }

        // Event Listeners
        document.getElementById('detectLocationBtn').addEventListener('click', getLiveLocation);
        document.getElementById('searchCityBtn').addEventListener('click', searchCity);
        document.getElementById('citySearch').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') searchCity();
        });

        // Filter tabs
        document.querySelectorAll('.filter-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                activeFilter = tab.getAttribute('data-type');
                renderRentalList(currentUserLocation, globalRentals, activeFilter);
                updateMapMarkers(currentUserLocation.lat, currentUserLocation.lng, globalRentals, activeFilter);
            });
        });

        // Expose copy function globally
        window.copyPhone = copyPhone;

        // Initialize with live location on load
        getLiveLocation();
    </script>
</body>

</html>
